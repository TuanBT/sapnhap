<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thêm prefix xã/phường</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea { width: 100%; height: 200px; margin-top: 10px; }
    pre { background: #f8f8f8; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
<h2>Tool thêm prefix (xã, phường, thị trấn)</h2>
<p>Nhập nội dung từng dòng theo mẫu:</p>
<pre>
xã A, xã B, C, D -> xã X
phường M, N, phường O -> phường Y
  </pre>

<textarea id="input" placeholder="Dán danh sách tại đây..."></textarea>
<button onclick="process()">Xử lý</button>

<h3>Kết quả:</h3>
<textarea id="output"></textarea>

<script>
  function processLine(line) {
    if (!line.includes("->")) return line;

    const [left, right] = line.split("->").map(s => s.trim());

    const items = left.split(",").map(item => item.trim());

    const knownPrefixes = ["xã", "phường", "thị trấn"];
    let currentPrefix = null;

    const processedItems = items.map(item => {
      const foundPrefix = knownPrefixes.find(p => item.startsWith(p));
      if (foundPrefix) {
        currentPrefix = foundPrefix;
        return item;
      } else if (currentPrefix) {
        return currentPrefix + " " + item;
      } else {
        return item; // không rõ prefix, giữ nguyên
      }
    });

    return processedItems.join(", ") + " -> " + right;
  }

  function process() {
    const input = document.getElementById("input").value;
    const lines = input.split("\n").map(line => line.trim());
    const output = lines.map(processLine).join("\n");
    document.getElementById("output").textContent = output;
  }
</script>
</body>
</html>
